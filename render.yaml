# Render Blueprint — deploys the Python/Prophet + pytrends FastAPI service.
# Render auto-detects this file when you create a new "Blueprint" from the repo.
services:
  - type: web
    name: grab-ml
    runtime: python
    rootDir: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
